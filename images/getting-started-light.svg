<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 942 132" width="942" height="132" role="img" aria-label="Five steps at launch: setupSDK reads Info.plist, networkSetup discovers Keycloak, the user signs in, getOrCreateConfiguration registers the device and its tag, and the device is located: by default startAdvertising broadcasts the tag for the BlueGPS antennas, or a supported positioning system hands its fixes to the SDK.">
  <defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8c959f"/></marker></defs>
  <rect x="16" y="12" width="164" height="64" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="32" y="38" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">1  Set up</text>
  <text x="32" y="60" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">reads Info.plist</text>
  <text x="98" y="100" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle">setupSDK()</text>
  <polyline points="182,44 200,44" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#head)"/>
  <rect x="202" y="12" width="164" height="64" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="218" y="38" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">2  Discover</text>
  <text x="218" y="60" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Keycloak endpoints</text>
  <text x="284" y="100" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle">networkSetup()</text>
  <polyline points="368,44 386,44" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#head)"/>
  <rect x="388" y="12" width="164" height="64" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="404" y="38" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">3  Sign in</text>
  <text x="404" y="60" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">as a user or a guest</text>
  <text x="470" y="100" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle">keycloakLogin()</text>
  <text x="470" y="118" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle">keycloakGuestLogin()</text>
  <polyline points="554,44 572,44" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#head)"/>
  <rect x="574" y="12" width="164" height="64" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="590" y="38" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">4  Register</text>
  <text x="590" y="60" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">the device and its tag</text>
  <text x="656" y="100" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle">getOrCreateConfiguration()</text>
  <polyline points="740,44 758,44" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#head)"/>
  <rect x="760" y="12" width="164" height="64" rx="12" fill="#3c74e5" stroke="none" stroke-width="1.5"/>
  <text x="776" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">5  Locate</text>
  <text x="776" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">BlueGPS antennas, or…</text>
  <text x="842" y="100" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle">startAdvertising()</text>
  <text x="842" y="118" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle">or newPositionAvailable(_:)</text>
</svg>
